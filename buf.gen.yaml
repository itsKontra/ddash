version: v2
clean: false
plugins:
  # Go lands at each file's go_package, under this module.
  - local: [go, tool, protoc-gen-go]
    out: .
    opt: module=github.com/itsKontra/ddash
  - local: [go, tool, protoc-gen-go-grpc]
    out: .
    opt: module=github.com/itsKontra/ddash
  # TS for Plugins lands in @ddash/proto, at each file's import path.
  - local: node_modules/.bin/protoc-gen-es
    out: packages/proto/src
    opt: target=ts
    exclude_types:
      - ddash.echo
      - ddash.sample
  # connect-go handlers for the core's own API only; Components are routed
  # from their descriptors (ADR 0002).
  - local: [go, tool, protoc-gen-connect-go]
    out: .
    opt: module=github.com/itsKontra/ddash
    types:
      - ddash.core.CoreService
