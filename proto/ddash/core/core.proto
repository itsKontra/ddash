syntax = "proto3";

// The core's own API. Its Actions pass the same gate as Components' Actions
// and are recorded in the Audit Log with target "core".
package ddash.core;

import "ddash/options.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/itsKontra/ddash/proto/ddash/core;corepb";

service CoreService {
  // ListInstalledPlugins returns the installed Plugins with their manifests
  // and where the shell loads their bundles from.
  rpc ListInstalledPlugins(ListInstalledPluginsRequest) returns (ListInstalledPluginsResponse) {
    option (ddash.getter) = {refresh: FAST};
  }
  // Install adds a Plugin to the installed set and starts the Components it
  // requires.
  rpc Install(InstallRequest) returns (InstallResponse) {
    option (ddash.action) = {};
  }
  // Uninstall removes a Plugin from the installed set, then stops and
  // removes every Component no installed Plugin still requires. Their DB
  // files and config are kept, the DB files listed as orphans, unless
  // delete_data is set.
  rpc Uninstall(UninstallRequest) returns (UninstallResponse) {
    option (ddash.action) = {disruptive: true};
  }
  // Restart stops a Component and starts it again, forgetting its crashes:
  // a Component that crashed about 5 times in 10 minutes stays down until
  // restarted. It never restarts the Components that require it.
  rpc Restart(RestartRequest) returns (RestartResponse) {
    option (ddash.action) = {disruptive: true};
  }
  // ListAuditLog reads the Audit Log a page at a time: chains, newest first,
  // each with its hops.
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse) {
    option (ddash.getter) = {refresh: NONE};
  }
}

message InstallRequest {
  string plugin = 1;
}

message InstallResponse {}

message UninstallRequest {
  string plugin = 1;
  // Also delete the removed Components' DB files and config.
  bool delete_data = 2;
}

message UninstallResponse {
  // Components whose DB file is kept although nothing runs them.
  repeated string orphans = 1;
}

message RestartRequest {
  string component = 1;
}

message RestartResponse {}

message ListInstalledPluginsRequest {}

message ListInstalledPluginsResponse {
  // By name.
  repeated InstalledPlugin plugins = 1;
}

// An installed Plugin: its plugin.yaml and where its bundle is.
message InstalledPlugin {
  string name = 1;
  string title = 2;
  string description = 3;
  // A lucide icon name, e.g. "container".
  string icon = 4;
  // The author's GitHub handle.
  string author = 5;
  // The Components the Plugin's UI may call.
  repeated string requires = 6;
  // The bundle's ESM entry: /plugins/<name>/<release>/index.js.
  string script = 7;
  // The bundle's stylesheet: /plugins/<name>/<release>/index.css.
  string style = 8;
}

message ListAuditLogRequest {
  // Only chains whose root ran for this kind of actor: "operator",
  // "component" or "core". Empty means any.
  string actor_kind = 1;
  // Only chains with a hop to this target: a Component's name or "core".
  // Empty means any.
  string target = 2;
  // Only chains with a hop that ended so: "ok", "failed" (a gRPC code),
  // "interrupted" or "running". Empty means any.
  string outcome = 3;
  // Chains per page: 50 when 0, at most 200.
  int32 page_size = 4;
  // The previous page's next_page_token; empty for the newest page.
  string page_token = 5;
}

message ListAuditLogResponse {
  // Newest root first.
  repeated AuditChain chains = 1;
  // Where the next page starts; empty on the last page.
  string next_page_token = 2;
  // Every target in the Audit Log, sorted, to filter by.
  repeated string targets = 3;
}

// The hops of one Action, linked by their chain id.
message AuditChain {
  string id = 1;
  // In the order they were admitted: the first is the root, the Action
  // the actor started.
  repeated AuditEntry entries = 2;
}

// One hop in the Audit Log.
message AuditEntry {
  // When the gate admitted it.
  google.protobuf.Timestamp time = 1;
  // "operator", "component" or "core".
  string actor_kind = 2;
  // The Operator's preferred_username or the Component's name.
  string username = 3;
  // The Operator's OIDC subject.
  string sub = 4;
  // A Component's name, or "core".
  string target = 5;
  // The bare method name, e.g. "Install".
  string method = 6;
  bool disruptive = 7;
  // The request as compact protojson, secrets redacted, cut at 4 KiB.
  string request = 8;
  // "ok", "interrupted", a failed Action's gRPC code (e.g.
  // "PermissionDenied"), or empty while it runs.
  string outcome = 9;
  // A failed Action's error message.
  string message = 10;
  // How long it ran; unset while it runs.
  google.protobuf.Duration duration = 11;
}
