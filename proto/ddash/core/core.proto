syntax = "proto3";

// The core's own API. Its Actions pass the same gate as Components' Actions
// and are recorded in the Audit Log with target "core".
package ddash.core;

import "ddash/options.proto";

option go_package = "github.com/itsKontra/ddash/proto/ddash/core;corepb";

service CoreService {
  // ListInstalledPlugins returns the installed Plugins with their manifests
  // and where the shell loads their bundles from.
  rpc ListInstalledPlugins(ListInstalledPluginsRequest) returns (ListInstalledPluginsResponse) {
    option (ddash.getter) = {refresh: FAST};
  }
  // Install adds a Plugin to the installed set and starts the Components it
  // requires.
  rpc Install(InstallRequest) returns (InstallResponse) {
    option (ddash.action) = {};
  }
  // Uninstall removes a Plugin from the installed set, then stops and
  // removes every Component no installed Plugin still requires. Their DB
  // files and config are kept, the DB files listed as orphans, unless
  // delete_data is set.
  rpc Uninstall(UninstallRequest) returns (UninstallResponse) {
    option (ddash.action) = {disruptive: true};
  }
  // Restart stops a Component and starts it again, forgetting its crashes:
  // a Component that crashed about 5 times in 10 minutes stays down until
  // restarted. It never restarts the Components that require it.
  rpc Restart(RestartRequest) returns (RestartResponse) {
    option (ddash.action) = {disruptive: true};
  }
}

message InstallRequest {
  string plugin = 1;
}

message InstallResponse {}

message UninstallRequest {
  string plugin = 1;
  // Also delete the removed Components' DB files and config.
  bool delete_data = 2;
}

message UninstallResponse {
  // Components whose DB file is kept although nothing runs them.
  repeated string orphans = 1;
}

message RestartRequest {
  string component = 1;
}

message RestartResponse {}

message ListInstalledPluginsRequest {}

message ListInstalledPluginsResponse {
  // By name.
  repeated InstalledPlugin plugins = 1;
}

// An installed Plugin: its plugin.yaml and where its bundle is.
message InstalledPlugin {
  string name = 1;
  string title = 2;
  string description = 3;
  // A lucide icon name, e.g. "container".
  string icon = 4;
  // The author's GitHub handle.
  string author = 5;
  // The Components the Plugin's UI may call.
  repeated string requires = 6;
  // The bundle's ESM entry: /plugins/<name>/<release>/index.js.
  string script = 7;
  // The bundle's stylesheet: /plugins/<name>/<release>/index.css.
  string style = 8;
}
