syntax = "proto3";

// docker-api reads containers from Docker hosts through read-only
// linuxserver/socket-proxy instances.
package ddash.dockerapi;

import "ddash/config/config.proto";
import "ddash/options.proto";

option go_package = "github.com/itsKontra/ddash/components/docker-api/dockerapipb;dockerapipb";

message DockerApiConfig {
  // The Docker hosts to read. Valid when empty.
  repeated Host hosts = 1 [(ddash.config.field) = {
    label: "Docker hosts"
    help: "Each host's read-only socket-proxy. None is fine."
  }];
}

message Host {
  // A short name the Operator knows the host by, e.g. "media".
  string name = 1 [(ddash.config.field) = {
    required: true
    placeholder: "media"
  }];
  // The host's socket-proxy, e.g. "tcp://198.18.2.10:2375".
  string url = 2 [(ddash.config.field) = {
    label: "Socket-proxy URL"
    required: true
    format: FORMAT_URL
    placeholder: "tcp://198.18.2.10:2375"
  }];
}

service DockerApiService {
  // ListContainers returns every container on every configured host, in
  // config order. A host that can't be read is listed with its error.
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse) {
    option (ddash.getter) = {refresh: FAST};
  }
}

message ListContainersRequest {}

message ListContainersResponse {
  repeated HostContainers hosts = 1;
}

message HostContainers {
  // The host's configured name.
  string host = 1;
  repeated Container containers = 2;
  // Why the host couldn't be read; empty when it could.
  string error = 3;
  // The host part of its socket-proxy URL, e.g. "198.18.2.10": where a
  // port published on every address (no ip) answers.
  string address = 4;
}

message Container {
  string id = 1;
  // The container's name, without Docker's leading slash.
  string name = 2;
  string image = 3;
  // Docker's state: created, running, paused, restarting, removing, exited or dead.
  string state = 4;
  // Docker's human-readable status, e.g. "Up 3 hours (healthy)".
  string status = 5;
  // Ports published on the host.
  repeated Port ports = 6;
}

message Port {
  // The host address the port is bound to; empty when Docker reports none.
  string ip = 1;
  uint32 public_port = 2;
  uint32 private_port = 3;
  // tcp, udp or sctp.
  string protocol = 4;
}
