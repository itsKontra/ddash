syntax = "proto3";

// network is the logic behind the Network Page. For now it watches the
// firewall's failover gateway group and derives the VPN Tunnel's tier.
package ddash.network;

import "ddash/config/config.proto";
import "ddash/options.proto";

option go_package = "github.com/itsKontra/ddash/components/network/networkpb;networkpb";

message NetworkConfig {
  // The firewall alias whose members leave through the WAN: the Direct
  // Devices. network changes only this alias, and only its Devices.
  string bypass_alias = 1 [(ddash.config.field) = {
    label: "Bypass alias"
    help: "The firewall alias whose members skip the VPN Tunnel (Direct Devices)."
    required: true
    choices_from: "pfsense-api.ListAliases"
  }];
  // The addresses Adopt reserves from, outside the DHCP pool.
  string reserved_range = 2 [(ddash.config.field) = {
    label: "Reserved range"
    help: "Where Adopt picks a New Device's reserved address. It must lie outside the DHCP pool."
    required: true
    format: FORMAT_IP_RANGE
    placeholder: "198.18.1.20-198.18.1.49"
  }];
}

service NetworkService {
  // GetVpnTunnel returns the VPN Tunnel's tier as of network's last read of
  // the failover gateway group (every 60 s).
  rpc GetVpnTunnel(GetVpnTunnelRequest) returns (GetVpnTunnelResponse) {
    option (ddash.getter) = {refresh: FAST};
  }
  // ListDevices returns every Device: the firewall's DHCP leases and static
  // mappings joined by MAC, with each one's membership of the bypass alias
  // and of the other aliases. Servers with fixed addresses aren't Devices,
  // and alias members that aren't Devices never show.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (ddash.getter) = {refresh: SLOW};
  }
}

message ListDevicesRequest {}

message ListDevicesResponse {
  // By address, lowest first.
  repeated Device devices = 1;
  // The configured bypass alias's name.
  string bypass_alias = 2;
}

// A piece of hardware the firewall hands addresses to, keyed by MAC.
message Device {
  // The MAC address in lower case, e.g. "02:5e:00:00:10:01".
  string mac = 1;
  // The static mapping's description, else its hostname, else the
  // hostname the Device sent; empty when there is none.
  string name = 2;
  // The reserved address of an Adopted Device, else the leased one.
  string ip = 3;
  // Whether the firewall sees it on the network now (ARP).
  bool online = 4;
  // Adopted: it has a static mapping. A New Device holds only a dynamic
  // lease.
  bool adopted = 5;
  // Direct: its address is in the bypass alias, so it skips the VPN
  // Tunnel. Tunnelled otherwise.
  bool direct = 6;
  // The lease it holds; a dynamic one over the static entry. Unset when
  // there is none.
  DeviceLease lease = 7;
  // Its static mapping; unset for a New Device.
  Reservation reservation = 8;
  // The other aliases containing its address, in the firewall's order;
  // network leaves them alone.
  repeated DeviceAlias aliases = 9;
}

message DeviceLease {
  string ip = 1;
  string hostname = 2;
  // e.g. "lan"; empty when Kea doesn't say.
  string interface = 3;
  // As pfSense writes them, the firewall's time; empty for a static entry.
  string starts = 4;
  string ends = 5;
  // "active", "expired" or "static".
  string status = 6;
  // e.g. "active/online" or "idle/offline".
  string online_status = 7;
}

// A Device's static mapping.
message Reservation {
  string interface = 1;
  string ip = 2;
  string hostname = 3;
  string description = 4;
}

message DeviceAlias {
  string name = 1;
  string description = 2;
}

message GetVpnTunnelRequest {}

message GetVpnTunnelResponse {
  // Which tier carries the VPN Tunnel; unspecified until the first read,
  // and while the last read failed.
  Tier tier = 1;
  // The failover gateway group's name.
  string group = 2;
  // The group's members, lowest tier first.
  repeated TunnelGateway gateways = 3;
  // Why the last read failed; empty when it worked.
  string error = 4;
}

// The VPN Tunnel's tier. The failover group's first tier is the WireGuard
// tunnel and any later one the OpenVPN fallback.
enum Tier {
  // Not known: not read yet, or the last read failed.
  TIER_UNSPECIFIED = 0;
  // Via WireGuard: a first-tier gateway passes traffic.
  TIER_WIREGUARD = 1;
  // Via the OpenVPN fallback: only a later tier's gateway passes traffic.
  TIER_OPENVPN = 2;
  // Down: no member of the group passes traffic.
  TIER_DOWN = 3;
}

message TunnelGateway {
  // The gateway's name in pfSense.
  string name = 1;
  // Its tier in the group, 1 to 5.
  int32 tier = 2;
  // Whether it passes traffic: up, and not excluded by the group's trigger.
  bool up = 3;
  // pfSense's status and substatus, e.g. "online" and "highloss".
  string status = 4;
  string substatus = 5;
  // Round-trip latency in milliseconds; unset when not measured.
  optional double delay_ms = 6;
  // Packet loss in percent; unset when not measured.
  optional double loss_percent = 7;
}
