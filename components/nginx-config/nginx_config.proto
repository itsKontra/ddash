syntax = "proto3";

// nginx-config reads nginx's effective config over SSH with a key that can
// do nothing but run `nginx -T`, and keeps the parsed result in memory.
package ddash.nginxconfig;

import "ddash/config/config.proto";
import "ddash/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/itsKontra/ddash/components/nginx-config/nginxconfigpb;nginxconfigpb";

message NginxConfigConfig {
  option (ddash.config.form) = {setup_from: "GetSetupHint"};

  // nginx's host, with ":port" when SSH isn't on 22.
  string host = 1 [(ddash.config.field) = {
    required: true
    placeholder: "nginx.home.example"
    help: "The host nginx runs on, reached over SSH. Add :port when SSH isn't on 22."
  }];
  // The user whose authorized_keys holds ddash's key.
  optional string user = 2 [(ddash.config.field) = {default: "root"}];
  // The host's SSH key, pinned: ddash refuses any other.
  string host_key = 3 [(ddash.config.field) = {
    label: "SSH host key"
    required: true
    placeholder: "ssh-ed25519 AAAA…"
    help: "The host's own key, as `ssh-keyscan -t ed25519 <host>` prints it."
  }];
}

service NginxConfigService {
  // GetSnapshot returns the last read of nginx's config.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse) {
    option (ddash.getter) = {refresh: SLOW};
  }
  // GetSetupHint returns the authorized_keys line that lets ddash's key run
  // `nginx -T` and nothing else. It is the config form's setup_from.
  rpc GetSetupHint(GetSetupHintRequest) returns (GetSetupHintResponse) {
    option (ddash.getter) = {refresh: NONE};
  }
  // Refresh re-reads nginx's config at once.
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (ddash.action) = {};
  }
}

message GetSnapshotRequest {}

message GetSnapshotResponse {
  Snapshot snapshot = 1;
}

message GetSetupHintRequest {}

message GetSetupHintResponse {
  ddash.config.SetupHint hint = 1;
}

message RefreshRequest {}

message RefreshResponse {
  Snapshot snapshot = 1;
}

// What ddash last read of nginx's config.
message Snapshot {
  // Grows by one each time what was read changes: the config, or why it
  // couldn't be read. 0 before the first read.
  int64 revision = 1;
  // When the config was last read and loaded; unset until it first was.
  google.protobuf.Timestamp read_at = 2;
  // Why the last read failed, e.g. nginx's own error text when its config
  // test fails; empty when it succeeded. servers are then those of the
  // last good read.
  string error = 3;
  // Every server block, in the order nginx loads them.
  repeated Server servers = 4;
}

// One nginx server block.
message Server {
  // The file and line the block starts at.
  string file = 1;
  int64 line = 2;
  repeated string server_names = 3;
  repeated Listen listens = 4;
  // The ssl_certificate path; empty without one.
  string ssl_certificate = 5;
  repeated Location locations = 6;
  // A server-level `return`'s arguments, e.g. "301 https://$host$request_uri"; empty without one.
  string return = 7;
}

message Listen {
  // As written, e.g. "443", "[::]:443" or "198.18.2.5:80".
  string address = 1;
  bool ssl = 2;
  bool default_server = 3;
}

message Location {
  // The location's arguments as written, e.g. "/" or "~ ^/api".
  string path = 1;
  // The proxy_pass target; empty without one.
  string proxy_pass = 2;
}
