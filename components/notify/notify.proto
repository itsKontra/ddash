syntax = "proto3";

// notify sends one Notification to every channel the Operator set up
// (ntfy-api, telegram-api) whose filter takes its category. Components
// that notify (checks, compose, proxmox) send through it, never through a
// channel directly.
package ddash.notify;

import "ddash/config/config.proto";
import "ddash/notification/notification.proto";
import "ddash/options.proto";

option go_package = "github.com/itsKontra/ddash/components/notify/notifypb;notifypb";

// Which categories each channel gets. Every category goes to every
// channel unless switched off here.
message NotifyConfig {
  optional bool ntfy_checks = 1 [(ddash.config.field) = {
    label: "ntfy: Checks"
    default: "true"
    help: "A Check going down or up again, Flapping, or its certificate expiring."
  }];
  optional bool ntfy_image_updates = 2 [(ddash.config.field) = {
    label: "ntfy: Image updates"
    default: "true"
    help: "A running container's image has a newer version in its registry."
  }];
  optional bool ntfy_action_outcomes = 3 [(ddash.config.field) = {
    label: "ntfy: Action outcomes"
    default: "true"
    help: "How a long Action ended, such as package updates or a backup."
  }];
  optional bool telegram_checks = 4 [(ddash.config.field) = {
    label: "Telegram: Checks"
    default: "true"
    help: "A Check going down or up again, Flapping, or its certificate expiring."
  }];
  optional bool telegram_image_updates = 5 [(ddash.config.field) = {
    label: "Telegram: Image updates"
    default: "true"
    help: "A running container's image has a newer version in its registry."
  }];
  optional bool telegram_action_outcomes = 6 [(ddash.config.field) = {
    label: "Telegram: Action outcomes"
    default: "true"
    help: "How a long Action ended, such as package updates or a backup."
  }];
}

service NotifyService {
  // Send delivers one Notification to every set-up channel whose filter
  // takes its category, all at once. It fails (Unavailable) only when
  // every channel that should have received it failed; channels not set
  // up or filtered out are skipped. A Notification without a category is
  // refused (InvalidArgument).
  rpc Send(SendRequest) returns (SendResponse) {
    option (ddash.action) = {};
  }
  // ListChannels reports each channel: whether it is set up, where it
  // sends to, and the categories it gets.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {
    option (ddash.getter) = {refresh: SLOW};
  }
}

// What a Notification is about; each channel's filter picks categories.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  // A Check went down or up again, is Flapping, or its certificate expires.
  CATEGORY_CHECKS = 1;
  // A container's image has a newer version.
  CATEGORY_IMAGE_UPDATES = 2;
  // A long Action (package updates, a backup) ended.
  CATEGORY_ACTION_OUTCOMES = 3;
}

message SendRequest {
  ddash.notification.Notification notification = 1;
  // What it is about; required: each channel's filter decides by it.
  Category category = 2;
}

message SendResponse {
  // One per channel, in ListChannels' order.
  repeated Delivery deliveries = 1;
}

message Delivery {
  // "ntfy" or "telegram".
  string channel = 1;
  DeliveryState state = 2;
  // Why it failed; empty unless state is failed.
  string error = 3;
}

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_SENT = 1;
  DELIVERY_STATE_FAILED = 2;
  // The channel isn't set up: skipped.
  DELIVERY_STATE_NOT_SET_UP = 3;
  // The channel's filter doesn't take the category: skipped.
  DELIVERY_STATE_FILTERED = 4;
}

message ListChannelsRequest {}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message Channel {
  // "ntfy" or "telegram".
  string name = 1;
  // How the UI names it: "ntfy", "Telegram".
  string title = 2;
  // The Component that delivers it, e.g. "telegram-api", whose config
  // form sets it up.
  string component = 3;
  bool set_up = 4;
  // Where it sends to, e.g. "ntfy.sh/ddash-alerts" or "chat 123456789";
  // empty while not set up.
  string destination = 5;
  // The categories its filter takes, whether set up or not.
  repeated Category categories = 6;
  // Why its state is unknown, e.g. its Component is down; empty normally.
  string problem = 7;
}
