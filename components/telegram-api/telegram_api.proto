syntax = "proto3";

// telegram-api is the Telegram channel: it serves
// ddash.notification.ChannelService and sends each Notification the core
// delivers to one Telegram chat through a bot. Only the telegram Plugin
// requires it.
package ddash.telegramapi;

import "ddash/config/config.proto";

option go_package = "github.com/itsKontra/ddash/components/telegram-api/telegramapipb;telegramapipb";

// The bot token and the chat ID are required: to not use Telegram,
// uninstall the telegram Plugin. The filter's fields (checks,
// image_updates, action_outcomes) mean the same in every channel's config
// (components/internal/channel).
message TelegramApiConfig {
  option (ddash.config.form) = {test_action: "SendTest"};

  // The Bot API server; Telegram's own unless self-hosted.
  optional string server = 1 [(ddash.config.field) = {
    label: "Bot API server"
    default: "https://api.telegram.org"
    format: FORMAT_URL
    help: "Leave as is unless you run your own Bot API server."
  }];
  // The token @BotFather gave the bot.
  string token = 2 [(ddash.config.field) = {
    label: "Bot token"
    secret: true
    required: true
    placeholder: "123456789:AAH…"
    help: "The token @BotFather gives for /newbot."
  }];
  // The chat the bot writes to: a user's ID for a private chat, a group's
  // (negative) ID, or a channel's @username.
  string chat_id = 3 [(ddash.config.field) = {
    label: "Chat ID"
    required: true
    placeholder: "123456789"
    help: "Your user ID for a private chat with the bot, a group's ID (it starts with -), or a channel's @username. Send the bot a message first."
  }];
  optional bool checks = 4 [(ddash.config.field) = {
    label: "Checks"
    default: "true"
    help: "A Check going down or up again, Flapping, or its certificate expiring."
  }];
  optional bool image_updates = 5 [(ddash.config.field) = {
    label: "Image updates"
    default: "true"
    help: "A running container's image has a newer version in its registry."
  }];
  optional bool action_outcomes = 6 [(ddash.config.field) = {
    label: "Action outcomes"
    default: "true"
    help: "How a long Action ended, such as package updates or a backup."
  }];
}
