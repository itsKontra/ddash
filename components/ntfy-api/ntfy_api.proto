syntax = "proto3";

// ntfy-api is the ntfy channel: it serves ddash.notification.ChannelService
// and publishes each Notification the core delivers to one ntfy topic. Only
// the ntfy Plugin requires it.
package ddash.ntfyapi;

import "ddash/config/config.proto";

option go_package = "github.com/itsKontra/ddash/components/ntfy-api/ntfyapipb;ntfyapipb";

// The topic is required: to not use ntfy, uninstall the ntfy Plugin. The
// filter's fields (checks, image_updates, action_outcomes) mean the same
// in every channel's config (components/internal/channel).
message NtfyApiConfig {
  option (ddash.config.form) = {test_action: "SendTest"};

  // The ntfy server, e.g. a self-hosted one behind the reverse proxy.
  optional string server = 1 [(ddash.config.field) = {
    default: "https://ntfy.sh"
    format: FORMAT_URL
    help: "The ntfy server the phone's ntfy app subscribes to."
  }];
  // The topic the phone subscribes to.
  string topic = 2 [(ddash.config.field) = {
    required: true
    placeholder: "ddash-alerts"
    help: "Letters, digits, - and _, at most 64. On a server without access control the topic name is the only secret."
  }];
  // An access token (tk_…) allowed to publish to the topic; empty for an
  // open topic.
  string token = 3 [(ddash.config.field) = {
    label: "Access token"
    secret: true
    help: "A token (tk_…) with write access to the topic. Leave empty for an open topic."
  }];
  optional bool checks = 4 [(ddash.config.field) = {
    label: "Checks"
    default: "true"
    help: "A Check going down or up again, Flapping, or its certificate expiring."
  }];
  optional bool image_updates = 5 [(ddash.config.field) = {
    label: "Image updates"
    default: "true"
    help: "A running container's image has a newer version in its registry."
  }];
  optional bool action_outcomes = 6 [(ddash.config.field) = {
    label: "Action outcomes"
    default: "true"
    help: "How a long Action ended, such as package updates or a backup."
  }];
}
