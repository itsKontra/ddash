name: apps
description: A record per App, discovered from Nginx Proxy Manager's Proxy Hosts and pfSense's Host Overrides, added as Link only, or added from a new Compose Project on a Docker Agent's host, with the Operator's settings and Ignores, its Warnings, the Workload behind it with its network info, and an HTTP(S) Check each.
requires: [nginx-proxy-manager-api, pfsense-api, network, checks, proxmox-api, docker-api, docker-agent-api]
