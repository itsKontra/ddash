syntax = "proto3";

// sample is a Component the host's own tests run. It is not shipped.
package ddash.sample;

import "ddash/config/config.proto";
import "ddash/options.proto";

option go_package = "github.com/itsKontra/ddash/core/internal/sample/samplepb;samplepb";

// SampleConfig has a field of every kind a config form supports.
message SampleConfig {
  // A sample without config is unconfigured. Start refuses "nowhere",
  // which the host's rules can't know.
  string target = 1 [(ddash.config.field) = {
    label: "Target"
    help: "Whom to greet."
    placeholder: "world"
    required: true
  }];
  optional string greeting = 2 [(ddash.config.field) = {default: "hello"}];
  optional int64 times = 3 [(ddash.config.field) = {
    default: "1"
    min: 1
    max: 10
  }];
  optional bool loud = 4 [(ddash.config.field) = {default: "true"}];
  optional Tone tone = 5 [(ddash.config.field) = {default: "TONE_WARM"}];
  string token = 6 [(ddash.config.field) = {secret: true}];
  string server = 7 [(ddash.config.field) = {format: FORMAT_URL}];
  repeated string tags = 8;
  repeated Peer peers = 9;
}

message Peer {
  string name = 1 [(ddash.config.field) = {required: true}];
  string address = 2 [(ddash.config.field) = {format: FORMAT_IP}];
  optional int64 port = 3 [(ddash.config.field) = {
    default: "22"
    min: 1
    max: 65535
  }];
}

enum Tone {
  TONE_UNSPECIFIED = 0;
  TONE_WARM = 1 [(ddash.config.value) = {label: "Warm and kind"}];
  TONE_COLD = 2;
}

service SampleService {
  // Greet answers with the config the sample started with. An empty name
  // is INVALID_ARGUMENT.
  rpc Greet(GreetRequest) returns (GreetResponse) {
    option (ddash.getter) = {};
  }
  // Wait blocks until the call ends.
  rpc Wait(WaitRequest) returns (WaitResponse) {
    option (ddash.getter) = {refresh: NONE};
  }
  // WaitAction blocks until the call ends.
  rpc WaitAction(WaitActionRequest) returns (WaitActionResponse) {
    option (ddash.action) = {};
  }
  // Act answers with the actor it ran for, unless its hook replaces it.
  rpc Act(ActRequest) returns (ActResponse) {
    option (ddash.action) = {disruptive: true};
  }
}

message ActRequest {
  string note = 1;
  string password = 2 [(ddash.config.field) = {secret: true}];
  Credentials credentials = 3;
  repeated Credentials more = 4;
}

message Credentials {
  string user = 1;
  string token = 2 [(ddash.config.field) = {secret: true}];
}

message ActResponse {
  string actor = 1;
}

message GreetRequest {
  string name = 1;
  int32 count = 2;
}

message GreetResponse {
  string greeting = 1;
  SampleConfig config = 2;
}

message WaitRequest {}

message WaitResponse {}

message WaitActionRequest {}

message WaitActionResponse {}
