name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the pnpm workspace
        run: make install
      - name: buf lint
        run: make lint-proto
      # Before the build: regenerating touches the generated sources, and
      # a build older than a source runs again.
      - name: Codegen drift
        run: make check-generated
      # The shell and vendor ESM (embedded by package web) and the Plugin
      # bundles (in the Release); go test needs them. The steps below that
      # need the build find it done.
      - name: Vite build
        run: make build
      - name: go vet
        run: make vet
      - name: golangci-lint
        run: make lint-go
      # oxlint, then the Plugin style lint (packages/plugin-check).
      - name: pnpm lint
        run: make lint-web
      # Imports each built Plugin bundle and checks what definePlugin returns.
      - name: Plugin contract check
        run: make check-plugins
      # checks' ICMP probe uses unprivileged ping sockets, which the kernel
      # allows only to the groups in this range (Docker sets it in containers).
      - name: Allow unprivileged ICMP
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      # go test ./... includes the subprocess test, which builds the Release
      # and boots the core with the real launcher against fakelab, and the
      # fixture IP guard (internal/ipguard).
      - name: go test
        run: make test-go
      - name: vitest
        run: make test-web
      - name: Typecheck
        run: make typecheck
