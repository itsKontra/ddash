# Everything ddash pins, kept current: the workflows' actions (by commit),
# the Go module, the pnpm workspace and the images' bases. One grouped PR
# per ecosystem a week, since a Release moves them all at once anyway.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    # Held at 1.60.1: with 1.62.0 (and libc 1.80.1) the core's crash tests
    # fail on GitHub's runners, every run, and the cause isn't known (#211).
    # libc moves only with the driver. Remove both once #211 is closed.
    ignore:
      - dependency-name: modernc.org/sqlite
      - dependency-name: modernc.org/libc
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/docker-agent
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
