name: docker
title: Docker
description: Compose Projects on every Docker host with a Docker Agent, their image updates, editing and Actions; containers behind read-only socket-proxies.
icon: container
author: itsKontra
# compose runs the Compose Project Actions and image checks (reading the
# registries through registry-api, which it requires); docker-agent-api
# pairs the Agents and reads Compose files; docker-api reads every host's
# containers, socket-proxy hosts too.
requires: [docker-api, docker-agent-api, compose]
